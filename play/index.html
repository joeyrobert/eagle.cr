<main class="wrap"><div class="page-head"><h1>Playable examples</h1><p class="lead">Every example is compiled to WebAssembly and WebGL2 from the same Crystal source that runs natively. Click a canvas to focus it. Sound starts after your first click.</p></div>
<div class="shots"><figure><a href="chess/index.html"><img src="../assets/screenshots/chess.png" alt="Chess screenshot" loading="lazy"></a><figcaption><b><a href="chess/index.html">Chess</a></b>Full rules with castling, en passant, promotion; perft-verified move generator and an alpha-beta AI.</figcaption></figure><figure><a href="checkers/index.html"><img src="../assets/screenshots/checkers.png" alt="Checkers screenshot" loading="lazy"></a><figcaption><b><a href="checkers/index.html">Checkers</a></b>One or two players, forced captures, multi-jumps, kings and a quiescence-searching AI.</figcaption></figure><figure><a href="breakout/index.html"><img src="../assets/screenshots/breakout.png" alt="Breakout screenshot" loading="lazy"></a><figcaption><b><a href="breakout/index.html">Breakout</a></b>Paddle, ball, bricks with hit points, particles, camera shake and synthesized sounds.</figcaption></figure><figure><a href="asteroids/index.html"><img src="../assets/screenshots/asteroids.png" alt="Asteroids screenshot" loading="lazy"></a><figcaption><b><a href="asteroids/index.html">Asteroids</a></b>Vector ship, splitting rocks, wrap-around space and thruster particles.</figcaption></figure><figure><a href="platformer/index.html"><img src="../assets/screenshots/platformer.png" alt="Platformer screenshot" loading="lazy"></a><figcaption><b><a href="platformer/index.html">Platformer</a></b>ASCII level to TileMap + colliders, coyote time, jump buffering, enemies you can stomp, coins and a goal.</figcaption></figure><figure><a href="snake/index.html"><img src="../assets/screenshots/snake.png" alt="Snake screenshot" loading="lazy"></a><figcaption><b><a href="snake/index.html">Snake</a></b>Grid logic with a unit-tested core and speed that ramps as you eat.</figcaption></figure><figure><a href="roguelike/index.html"><img src="../assets/screenshots/roguelike.png" alt="Roguelike screenshot" loading="lazy"></a><figcaption><b><a href="roguelike/index.html">Roguelike</a></b>Procedural dungeons, shadowcasting field of view, monsters that chase, items, five levels.</figcaption></figure><figure><a href="coinrush3d/index.html"><img src="../assets/screenshots/coinrush3d.png" alt="Coin Rush (3D) screenshot" loading="lazy"></a><figcaption><b><a href="coinrush3d/index.html">Coin Rush (3D)</a></b>Roll a ball around a lit, shadowed arena collecting coins before the timer runs out.</figcaption></figure><figure><a href="flythrough3d/index.html"><img src="../assets/screenshots/flythrough3d.png" alt="3D fly-through screenshot" loading="lazy"></a><figcaption><b><a href="flythrough3d/index.html">3D fly-through</a></b>Every 3D feature: primitives, textures, lights, shadows, fog, transparency, wireframe, picking.</figcaption></figure><figure><a href="physics/index.html"><img src="../assets/screenshots/physics.png" alt="2D physics screenshot" loading="lazy"></a><figcaption><b><a href="physics/index.html">2D physics</a></b>Rigid bodies, stacking, ramps, sensors and additive particle bursts.</figcaption></figure><figure><a href="physics3d/index.html"><img src="../assets/screenshots/physics3d.png" alt="3D physics screenshot" loading="lazy"></a><figcaption><b><a href="physics3d/index.html">3D physics</a></b>Spheres and boxes with SAT contacts, stacking pyramid, kinematic ramp.</figcaption></figure><figure><a href="ui/index.html"><img src="../assets/screenshots/ui.png" alt="UI toolkit screenshot" loading="lazy"></a><figcaption><b><a href="ui/index.html">UI toolkit</a></b>Panels, buttons, sliders, checkboxes, text input, grids and themes.</figcaption></figure><figure><a href="interactions/index.html"><img src="../assets/screenshots/interactions.png" alt="Interactions screenshot" loading="lazy"></a><figcaption><b><a href="interactions/index.html">Interactions</a></b>Every input pattern with a live event log: clicks, drags, wheel zoom, text, gamepads, signals, timers.</figcaption></figure><figure><a href="sandbox2d/index.html"><img src="../assets/screenshots/sandbox2d.png" alt="2D sandbox screenshot" loading="lazy"></a><figcaption><b><a href="sandbox2d/index.html">2D sandbox</a></b>Scene tree, tile map, following camera with shake, tweens and a HUD layer.</figcaption></figure><figure><a href="embedded/index.html"><img src="../assets/screenshots/embedded.png" alt="Embedded assets screenshot" loading="lazy"></a><figcaption><b><a href="embedded/index.html">Embedded assets</a></b>A game whose PNG, WAV and shader are baked into the binary at compile time.</figcaption></figure><figure><a href="smoke/index.html"><img src="../assets/screenshots/smoke.png" alt="Smoke test screenshot" loading="lazy"></a><figcaption><b><a href="smoke/index.html">Smoke test</a></b>Shapes, sprites, lines and text: the first thing Eagle ever rendered.</figcaption></figure></div></main>
