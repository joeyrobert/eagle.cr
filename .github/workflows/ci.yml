name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LIBGL_ALWAYS_SOFTWARE: "1"
      SDL_AUDIODRIVER: dummy
      SDL_VIDEODRIVER: x11

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libgl1-mesa-dev \
            libgl1-mesa-dri \
            libsdl2-dev \
            mesa-utils \
            xauth \
            xvfb

      - name: Install Crystal
        uses: crystal-lang/install-crystal@d8ef131ecec0352ce0e39b81b0a6d95def58fe2f # v1.9.2
        with:
          crystal: 1.21.0

      - name: Check dependencies
        run: shards check

      - name: Run specs with software OpenGL
        run: |
          xvfb-run --auto-servernum \
            --server-args="-screen 0 1280x720x24 -ac +extension GLX +render -noreset" \
            sh -c 'glxinfo -B && crystal spec --error-trace'

      - name: Build CLI
        run: crystal build src/cli.cr -o bin/eagle

      - name: Build examples
        run: script/build-examples.sh --link

      - name: Check documentation examples
        run: crystal run script/check_doc_examples.cr
